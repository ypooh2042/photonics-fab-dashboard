server {
    listen 443 ssl;
    server_name fab.yourdomain.example;

    ssl_certificate /etc/letsencrypt/live/fab.yourdomain.example/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/fab.yourdomain.example/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    if ($host = fab.yourdomain.example) {
        return 301 https://$host$request_uri;
    }

    listen 80;
    server_name fab.yourdomain.example;
    return 404;
}
